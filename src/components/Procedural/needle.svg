<?xml version="1.0" encoding="utf-8"?>
<!-- Diamond needle (wider): top half red, bottom half black -->
<!-- viewBox widened to 20 so the needle fills more horizontal space and CSS sizing affects its width -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 40" width="20" height="40" preserveAspectRatio="xMidYMid meet">
  <!-- top half occupies full width (left 0, right 20) -->
  <polygon points="10,0 16,20 4,20" fill="#ff3b30" />
  <!-- bottom half occupies full width -->
  <polygon points="10,40 16,20 4,20" fill="#000000" />
</svg>
